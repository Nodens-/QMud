name: Pipelines

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]
    tags: [ "v*" ]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      run_full_tests:
        description: "Run full test suite"
        required: false
        type: boolean
        default: false
      run_coverage:
        description: "Run coverage"
        required: false
        type: boolean
        default: false
      publish_tagged_release:
        description: "Publish tagged-release"
        required: false
        type: boolean
        default: false
      publish_ci_main:
        description: "Publish ci-main"
        required: false
        type: boolean
        default: false
      run_main_pipeline:
        description: "Run push-to-main (MutEx)"
        required: false
        type: boolean
        default: false
      run_tagged_release:
        description: "Run tagged-release (MutEx)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  pipeline-plan:
    name: Plan pipeline matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      needs_linux_image: ${{ steps.plan.outputs.needs_linux_image }}
      artifact_run_id: ${{ steps.plan.outputs.artifact_run_id }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      publish_tagged_release: ${{ steps.plan.outputs.publish_tagged_release }}
      publish_ci_release: ${{ steps.plan.outputs.publish_ci_release }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Determine tasks
        id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const entries = [];
            const hosted = "ubuntu-latest";
            const selfHosted = ["self-hosted", "primary"];
            const addValidation = (task, timeout) => entries.push({
              task, kind: "validation", runner: hosted, timeout,
            });
            const addBuilds = (buildType = "Release", taskPrefix = "build") => {
              for (const packageName of ["appimage", "macos", "windows"]) {
                entries.push({
                  task: taskPrefix + "-" + packageName,
                  kind: "build",
                  package: packageName,
                  build_type: buildType,
                  runner: selfHosted,
                  timeout: 180,
                });
              }
            };
            const resolveTagCommit = async (tagName) => {
              const tagRef = await github.rest.git.getRef({owner, repo, ref: `tags/${tagName}`});
              let target = tagRef.data.object;
              while (target.type === "tag") {
                const tag = await github.rest.git.getTag({owner, repo, tag_sha: target.sha});
                target = tag.data.object;
              }
              if (target.type !== "commit") {
                throw new Error(`${tagName} does not resolve to a commit.`);
              }
              return target.sha;
            };
            const resolveLatestVersionTag = async () => {
              const tags = await github.paginate(github.rest.repos.listTags, {
                owner, repo, per_page: 100,
              });
              const versionTags = tags
                .map((tag) => tag.name)
                .filter((name) => /^v\d+(?:\.\d+)*$/.test(name));
              if (versionTags.length === 0) {
                throw new Error("No version tags were found.");
              }
              const versionParts = (name) => name.slice(1).split(".").map(Number);
              versionTags.sort((left, right) => {
                const leftParts = versionParts(left);
                const rightParts = versionParts(right);
                const count = Math.max(leftParts.length, rightParts.length);
                for (let index = 0; index < count; ++index) {
                  const difference = (rightParts[index] ?? 0) - (leftParts[index] ?? 0);
                  if (difference !== 0) return difference;
                }
                return right.localeCompare(left);
              });
              const name = versionTags[0];
              return {name, sha: await resolveTagCommit(name)};
            };
            const resolveMainHead = async () => {
              const mainRef = await github.rest.git.getRef({owner, repo, ref: "heads/main"});
              if (mainRef.data.object.type !== "commit") {
                throw new Error("refs/heads/main does not resolve to a commit.");
              }
              return mainRef.data.object.sha;
            };
            const releaseExists = async (tagName) => {
              try {
                await github.rest.repos.getReleaseByTag({owner, repo, tag: tagName});
                return true;
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            };
            const releaseTargetsCommit = async (tagName, sourceSha) => {
              if (!await releaseExists(tagName)) return false;
              try {
                return await resolveTagCommit(tagName) === sourceSha;
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            };
            const artifactNames = (sourceSha) => new Set([
              `qmud-appimage-${sourceSha}`,
              `qmud-macos-${sourceSha}`,
              `qmud-windows-${sourceSha}`,
            ]);
            const findArtifactRun = async (publication, sourceSha, releaseTag = "") => {
              const ciJobs = ["build-appimage", "build-macos", "build-windows"];
              const taggedJobs = ["tagged-build-appimage", "tagged-build-macos", "tagged-build-windows"];
              const requiredArtifacts = artifactNames(sourceSha);

              for (let page = 1; ; page += 1) {
                const response = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: "pipelines.yml",
                  status: "completed",
                  per_page: 100,
                  page,
                });
                const runs = Array.isArray(response.data.workflow_runs) ? response.data.workflow_runs : [];
                for (const run of runs) {
                  if (run.event === "pull_request" || run.id === context.runId) {
                    continue;
                  }

                  const automaticTaggedRun = publication === "tagged" &&
                    run.event === "push" && run.head_branch === releaseTag;
                  const manualTaggedRun = publication === "tagged" && run.event === "workflow_dispatch";
                  const ciRun = publication === "ci" &&
                    ((run.event === "push" && run.head_branch === "main") || run.event === "workflow_dispatch");
                  if (!automaticTaggedRun && !manualTaggedRun && !ciRun) continue;

                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                    owner, repo, run_id: run.id, per_page: 100,
                  });
                  const successfulJobs = new Set(
                    jobs.filter((job) => job.conclusion === "success").map((job) => job.name),
                  );
                  const hasCiJobs = ciJobs.every((name) => successfulJobs.has(name));
                  const hasTaggedJobs = taggedJobs.every((name) => successfulJobs.has(name));
                  if ((ciRun && !hasCiJobs) ||
                      (manualTaggedRun && !hasTaggedJobs) ||
                      (automaticTaggedRun && !hasTaggedJobs && !hasCiJobs)) {
                    continue;
                  }

                  const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                    owner, repo, run_id: run.id, per_page: 100,
                  });
                  const availableArtifacts = new Set(
                    artifacts.filter((artifact) => !artifact.expired).map((artifact) => artifact.name),
                  );
                  if ([...requiredArtifacts].every((name) => availableArtifacts.has(name))) {
                    return String(run.id);
                  }
                }
                if (runs.length < 100) break;
              }

              return "";
            };
            const coveragePath = (name) => name.startsWith("src/") || name.startsWith("tests/");
            const pipelinePath = (name) => (
              coveragePath(name) ||
              name.startsWith("resources/") ||
              name.startsWith("skeleton/") ||
              name.startsWith("tools/") ||
              name === "CMakeLists.txt" ||
              name.endsWith("/CMakeLists.txt")
            );

            let runPipeline = false;
            let runCoverage = false;
            let artifactRunId = String(context.runId);
            let sourceSha = context.sha;
            let releaseTag = "";
            let publishTaggedRelease = false;
            let publishCiRelease = false;
            if (context.eventName === "pull_request") {
              const pullNumber = context.payload.pull_request.number;
              for (let page = 1; ; page += 1) {
                const response = await github.rest.pulls.listFiles({
                  owner, repo, pull_number: pullNumber, per_page: 100, page,
                });
                const files = Array.isArray(response.data) ? response.data : [];
                runPipeline ||= files.some((file) => pipelinePath(file.filename || ""));
                runCoverage ||= files.some((file) => coveragePath(file.filename || ""));
                if ((runPipeline && runCoverage) || files.length < 100) break;
              }
              if (runPipeline) {
                addValidation("quick-tests", 90);
                addBuilds("Debug");
              }
            } else if (context.eventName === "push" && context.ref === "refs/heads/main") {
              const before = context.payload.before;
              const after = context.payload.after || context.sha;
              if (!before || /^0+$/.test(before)) {
                runPipeline = true;
              } else {
                const response = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: before + "..." + after,
                });
                const files = Array.isArray(response.data.files) ? response.data.files : [];
                runPipeline = files.some((file) => pipelinePath(file.filename || ""));
                runCoverage = files.some((file) => coveragePath(file.filename || ""));
              }
              if (runPipeline) {
                addValidation("quick-tests", 90);
                if (runCoverage) addValidation("coverage", 120);
                addBuilds();
                publishCiRelease = true;
              }
            } else if (context.eventName === "push" && context.ref.startsWith("refs/tags/v")) {
              releaseTag = context.ref.replace("refs/tags/", "");
              sourceSha = await resolveTagCommit(releaseTag);
              addBuilds("Release", "tagged-build");
              publishTaggedRelease = true;
            } else if (context.eventName === "schedule") {
              addValidation("full-tests", 90);
            } else if (context.eventName === "workflow_dispatch") {
              const runMainPipeline = context.payload.inputs?.run_main_pipeline === "true";
              const runTaggedRelease = context.payload.inputs?.run_tagged_release === "true";
              if (runMainPipeline && runTaggedRelease) {
                throw new Error("Select only one mutually exclusive complete pipeline.");
              }

              if (runMainPipeline) {
                sourceSha = await resolveMainHead();
                addValidation("quick-tests", 90);
                addValidation("coverage", 120);
                addBuilds();
                publishCiRelease = true;
              } else if (runTaggedRelease) {
                const latestTag = await resolveLatestVersionTag();
                releaseTag = latestTag.name;
                sourceSha = latestTag.sha;
                addBuilds("Release", "tagged-build");
                publishTaggedRelease = true;
              } else {
                if (context.payload.inputs?.run_full_tests === "true") addValidation("full-tests", 90);
                if (context.payload.inputs?.run_coverage === "true") addValidation("coverage", 120);

                const publishTagged = context.payload.inputs?.publish_tagged_release === "true";
                const publishCi = context.payload.inputs?.publish_ci_main === "true";
                if (publishTagged && publishCi) {
                  throw new Error("Select only one publication target.");
                }
                if (publishTagged) {
                  const latestTag = await resolveLatestVersionTag();
                  releaseTag = latestTag.name;
                  sourceSha = latestTag.sha;
                  if (await releaseExists(releaseTag)) {
                    throw new Error(`${releaseTag} has already been released.`);
                  }
                  artifactRunId = await findArtifactRun("tagged", sourceSha, releaseTag);
                  if (!artifactRunId) {
                    artifactRunId = String(context.runId);
                    addBuilds("Release", "tagged-build");
                  }
                  publishTaggedRelease = true;
                } else if (publishCi) {
                  sourceSha = await resolveMainHead();
                  if (await releaseTargetsCommit("ci-main", sourceSha)) {
                    throw new Error(`The current main commit ${sourceSha} has already been published as ci-main.`);
                  }
                  artifactRunId = await findArtifactRun("ci", sourceSha);
                  if (!artifactRunId) {
                    artifactRunId = String(context.runId);
                    addBuilds();
                  }
                  publishCiRelease = true;
                }
              }
            }

            const needsLinuxImage = entries.some((entry) => entry.kind === "validation");
            if (entries.length === 0) {
              entries.push({task: "nothing-to-run", kind: "noop", runner: hosted, timeout: 5});
            }
            core.info("Pipeline matrix: " + JSON.stringify(entries));
            core.setOutput("matrix", JSON.stringify({include: entries}));
            core.setOutput("needs_linux_image", needsLinuxImage ? "true" : "false");
            core.setOutput("artifact_run_id", artifactRunId);
            core.setOutput("source_sha", sourceSha);
            core.setOutput("release_tag", releaseTag);
            core.setOutput("publish_tagged_release", publishTaggedRelease ? "true" : "false");
            core.setOutput("publish_ci_release", publishCiRelease ? "true" : "false");

  prepare-linux-image:
    name: Prepare Linux image
    needs: pipeline-plan
    if: needs.pipeline-plan.outputs.needs_linux_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image-reference.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pipeline-plan.outputs.source_sha }}
      - name: Resolve Linux image reference
        id: image-reference
        run: |
          set -euo pipefail
          IMAGE_SERIAL="$(tr -d '[:space:]' < tools/docker/appimage-qt611/IMAGE_REVISION)"
          if ! [[ "$IMAGE_SERIAL" =~ ^[0-9]{10}$ ]]; then
            echo "Invalid AppImage image revision: $IMAGE_SERIAL" >&2
            exit 1
          fi
          echo "image=ghcr.io/abnormal-frequency/qmud-appimage-builder:$IMAGE_SERIAL" >> "$GITHUB_OUTPUT"
      - name: Check Linux image
        id: image-status
        env:
          GHCR_IMAGE: ${{ steps.image-reference.outputs.image }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$GHCR_IMAGE" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "The required repository-owned Linux image is missing, and fork pull requests cannot publish it: $GHCR_IMAGE" >&2
            exit 1
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
      - name: Build Linux image
        id: build-image
        if: steps.image-status.outputs.exists == 'false'
        env:
          GHCR_IMAGE: ${{ steps.image-reference.outputs.image }}
        run: |
          set -euo pipefail
          LOCAL_IMAGE="qmud-appimage-builder:${GHCR_IMAGE##*:}"
          docker build --pull --no-cache \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=${GHCR_IMAGE##*:}" \
            --file tools/docker/appimage-qt611/Dockerfile \
            --tag "$LOCAL_IMAGE" \
            tools/docker/appimage-qt611
          if docker manifest inspect "$GHCR_IMAGE" >/dev/null; then
            echo "needs_push=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_push=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push Linux image
        id: push-image
        if: steps.build-image.outputs.needs_push == 'true'
        env:
          GHCR_IMAGE: ${{ steps.image-reference.outputs.image }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$GHCR_PAT" ]; then
            echo "GHCR_PAT is unavailable." >&2
            exit 1
          fi
          LOCAL_IMAGE="qmud-appimage-builder:${GHCR_IMAGE##*:}"
          skopeo copy \
            --dest-creds "$GITHUB_REPOSITORY_OWNER:$GHCR_PAT" \
            "docker-daemon:$LOCAL_IMAGE" \
            "docker://$GHCR_IMAGE"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Keep the newest two Linux images
        if: steps.push-image.outputs.pushed == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: Abnormal-Frequency
          package-name: qmud-appimage-builder
          package-type: container
          min-versions-to-keep: 2
          token: ${{ secrets.GHCR_PAT }}

  pipeline:
    name: ${{ matrix.task }}
    needs: [ pipeline-plan, prepare-linux-image ]
    if: always() && needs.pipeline-plan.result == 'success' && (needs.prepare-linux-image.result == 'success' || needs.prepare-linux-image.result == 'skipped')
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.pipeline-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      QMUD_LINUX_IMAGE: ${{ needs.prepare-linux-image.outputs.image }}
      QMUD_SOURCE_SHA: ${{ needs.pipeline-plan.outputs.source_sha }}
    steps:
      - name: Check out repository
        if: matrix.kind != 'noop'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pipeline-plan.outputs.source_sha }}

      - name: Pull Linux image
        if: matrix.kind == 'validation'
        run: docker pull "$QMUD_LINUX_IMAGE"

      - name: Run test suite
        if: matrix.task == 'quick-tests' || matrix.task == 'full-tests'
        env:
          TEST_SUITE: ${{ matrix.task }}
        run: |
          mkdir -p ci-build
          chmod 0777 ci-build
          docker run --rm --interactive --user "$(id -u):$(id -g)" \
            -e CCACHE_DISABLE=1 -e HOME=/tmp -e QT_QPA_PLATFORM=offscreen \
            -v "$GITHUB_WORKSPACE:/home/user/project:ro" \
            -v "$GITHUB_WORKSPACE/ci-build:/home/user/build:rw" \
            "$QMUD_LINUX_IMAGE" bash -s -- "$TEST_SUITE" <<'CONTAINER'
          set -euo pipefail
          TEST_SUITE=$1
          cmake -S /home/user/project -B /home/user/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH=/opt/Qt/latest/gcc_64 \
            -DQt6_DIR=/opt/Qt/latest/gcc_64/lib/cmake/Qt6 \
            -DQMUD_ENABLE_TESTING=ON -DQMUD_ENABLE_GUI_TESTS=ON \
            -DQMUD_ENABLE_APPIMAGE=OFF \
            -DQMUD_ENABLE_APPIMAGE_DOCKER=OFF \
            -DQMUD_ENABLE_MAC_DOCKER=OFF -DQMUD_ENABLE_WINDOCKER=OFF
          CCACHE_DISABLE=1 cmake --build /home/user/build --parallel
          if [ "$TEST_SUITE" = quick-tests ]; then
            ctest --test-dir /home/user/build --output-on-failure --label-exclude slow
          else
            ctest --test-dir /home/user/build --output-on-failure
          fi
          CONTAINER
      - name: Upload CTest logs
        if: always() && (matrix.task == 'quick-tests' || matrix.task == 'full-tests')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.task }}-ctest-logs
          if-no-files-found: ignore
          path: |
            ci-build/Testing/Temporary/*
            ci-build/Testing/**/*.xml
      - name: Upload failing test executables
        if: failure() && (matrix.task == 'quick-tests' || matrix.task == 'full-tests')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.task }}-qtest-binaries
          if-no-files-found: ignore
          path: ci-build/tests/tst_*

      - name: Run coverage
        if: matrix.task == 'coverage'
        run: |
          mkdir -p ci-build
          chmod 0777 ci-build
          docker run --rm --interactive --user "$(id -u):$(id -g)" \
            -e CCACHE_DISABLE=1 -e HOME=/tmp -e QT_QPA_PLATFORM=offscreen \
            -v "$GITHUB_WORKSPACE:/home/user/project:ro" \
            -v "$GITHUB_WORKSPACE/ci-build:/home/user/build:rw" \
            "$QMUD_LINUX_IMAGE" bash -s <<'CONTAINER'
          set -euo pipefail
          cmake -S /home/user/project -B /home/user/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH=/opt/Qt/latest/gcc_64 \
            -DQt6_DIR=/opt/Qt/latest/gcc_64/lib/cmake/Qt6 \
            -DQMUD_ENABLE_TESTING=ON -DQMUD_ENABLE_GUI_TESTS=ON \
            -DQMUD_ENABLE_APPIMAGE=OFF \
            -DQMUD_ENABLE_APPIMAGE_DOCKER=OFF \
            -DQMUD_ENABLE_MAC_DOCKER=OFF -DQMUD_ENABLE_WINDOCKER=OFF \
            -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage \
            -DCMAKE_EXE_LINKER_FLAGS=--coverage
          CCACHE_DISABLE=1 cmake --build /home/user/build --parallel
          ctest --test-dir /home/user/build --output-on-failure --label-exclude slow
          mkdir -p /home/user/build/coverage-html
          gcovr --root /home/user/project --object-directory /home/user/build \
            --filter /home/user/project/src/ --print-summary \
            --xml-pretty --xml /home/user/build/coverage.xml \
            --html-details /home/user/build/coverage-html/index.html
          CONTAINER
      - name: Upload coverage artifacts
        if: matrix.task == 'coverage'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qmud-coverage
          if-no-files-found: error
          path: |
            ci-build/coverage.xml
            ci-build/coverage-html/**
      - name: Upload coverage to Codecov
        if: matrix.task == 'coverage'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ci-build/coverage.xml
          fail_ci_if_error: true

      - name: Clean self-hosted workspace
        if: matrix.kind == 'build'
        run: rm -rf cmake-build-release cmake-build-coverage release-assets
      - name: Resolve package version
        if: matrix.kind == 'build'
        env:
          TAGGED_RELEASE_BUILD: ${{ startsWith(matrix.task, 'tagged-build-') }}
        run: |
          set -euo pipefail
          BASE_VERSION="$(sed -n 's/.*kVersionString\[\] = "\([^"]*\)".*/\1/p' src/Version.h | head -n 1)"
          if [ -z "$BASE_VERSION" ]; then
            echo "Failed to resolve kVersionString from src/Version.h" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* || "$TAGGED_RELEASE_BUILD" == "true" ]]; then
            PACKAGE_VERSION="$BASE_VERSION"
          else
            PACKAGE_VERSION="ci-${QMUD_SOURCE_SHA::7}"
          fi
          echo "QMUD_PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
      - name: Verify self-hosted dependencies
        if: matrix.kind == 'build'
        run: |
          set -euo pipefail
          for tool in cmake ninja python3 pkg-config gcc g++ curl patchelf podman; do
            command -v "$tool" >/dev/null 2>&1 || { echo "Missing required tool: $tool" >&2; exit 1; }
          done
      - name: Resolve self-hosted Qt 6
        if: matrix.kind == 'build'
        run: |
          set -euo pipefail
          QT6_CMAKE_DIR=""
          if [ -n "${QT_ROOT:-}" ]; then
            if [ -d "$QT_ROOT/lib/cmake/Qt6" ]; then
              QT6_CMAKE_DIR="$QT_ROOT/lib/cmake/Qt6"
            elif [ -d "$QT_ROOT/lib64/cmake/Qt6" ]; then
              QT6_CMAKE_DIR="$QT_ROOT/lib64/cmake/Qt6"
            else
              echo "Qt6 CMake package not found under $QT_ROOT." >&2
              exit 1
            fi
          else
            QT6_CONFIG_FILE="$(find /opt/Qt /usr/lib64 /usr/lib -type f -path '*/cmake/Qt6/Qt6Config.cmake' 2>/dev/null | sort | head -n 1 || true)"
            if [ -z "$QT6_CONFIG_FILE" ]; then
              echo "Failed to locate Qt6Config.cmake." >&2
              exit 1
            fi
            QT6_CMAKE_DIR="$(dirname "$QT6_CONFIG_FILE")"
          fi
          QT_ROOT="$(cd "$QT6_CMAKE_DIR/../../.." && pwd)"
          echo "QT_ROOT=$QT_ROOT" >> "$GITHUB_ENV"
          echo "QT6_CMAKE_DIR=$QT6_CMAKE_DIR" >> "$GITHUB_ENV"
      - name: Resolve self-hosted container executable
        if: matrix.kind == 'build'
        run: |
          CONTAINER_BIN="$(command -v podman || true)"
          if [ -z "$CONTAINER_BIN" ]; then
            echo "podman executable not found on PATH." >&2
            exit 1
          fi
          echo "QMUD_DOCKER_EXECUTABLE=$CONTAINER_BIN" >> "$GITHUB_ENV"
      - name: Prepare package builder image
        if: matrix.kind == 'build'
        env:
          PACKAGE_KIND: ${{ matrix.package }}
        run: |
          set -euo pipefail
          case "$PACKAGE_KIND" in
            appimage)
              IMAGE=qmud-appimage-builder:qt6.11
              DOCKERFILE=tools/docker/appimage-qt611/Dockerfile
              CONTEXT=tools/docker/appimage-qt611 ;;
            macos)
              IMAGE=qmud-macos-builder:qt6.11
              DOCKERFILE=tools/docker/macos-qt611/Dockerfile
              CONTEXT=tools/docker/macos-qt611 ;;
            windows)
              IMAGE=qmud-windows-builder:qt6.11
              DOCKERFILE=tools/docker/windows-qt611/Dockerfile
              CONTEXT=tools/docker/windows-qt611 ;;
          esac
          if ! podman image exists "$IMAGE"; then
            podman build --file "$DOCKERFILE" --tag "$IMAGE" "$CONTEXT"
          fi
      - name: Configure package build
        if: matrix.kind == 'build'
        env:
          PACKAGE_KIND: ${{ matrix.package }}
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          set -euo pipefail
          APPIMAGE_DOCKER=OFF
          MAC_DOCKER=OFF
          WIN_DOCKER=OFF
          case "$PACKAGE_KIND" in
            appimage) APPIMAGE_DOCKER=ON; CONTAINER_NAME=AppImageDocker ;;
            macos) MAC_DOCKER=ON; CONTAINER_NAME=MacDockerU ;;
            windows) WIN_DOCKER=ON; CONTAINER_NAME=WinDocker ;;
          esac
          echo "QMUD_CI_CONTAINER_NAME=$CONTAINER_NAME" >> "$GITHUB_ENV"
          cmake -S . -B cmake-build-release -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT" -DQt6_DIR="$QT6_CMAKE_DIR" \
            -DQMUD_ENABLE_TESTING=OFF -DQMUD_CI_BUILD=ON \
            -DQMUD_APPIMAGE_VERSION="$QMUD_PACKAGE_VERSION" \
            -DQMUD_DOCKER_EXECUTABLE="$QMUD_DOCKER_EXECUTABLE" \
            -DQMUD_DOCKER_CONTAINER_NAME="$CONTAINER_NAME" \
            -DQMUD_APPIMAGE_DOCKER_BUILD_TYPE="$BUILD_TYPE" \
            -DQMUD_MAC_DOCKER_BUILD_TYPE="$BUILD_TYPE" \
            -DQMUD_WINDOCKER_BUILD_TYPE="$BUILD_TYPE" \
            -DQMUD_ENABLE_APPIMAGE=OFF \
            -DQMUD_ENABLE_APPIMAGE_DOCKER="$APPIMAGE_DOCKER" \
            -DQMUD_ENABLE_MAC_DOCKER="$MAC_DOCKER" \
            -DQMUD_ENABLE_WINDOCKER="$WIN_DOCKER"
      - name: Build package
        if: matrix.kind == 'build'
        env:
          PACKAGE_KIND: ${{ matrix.package }}
        run: |
          set -euo pipefail
          cleanup_package_container() {
            "$QMUD_DOCKER_EXECUTABLE" rm --force "$QMUD_CI_CONTAINER_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup_package_container EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          cleanup_package_container
          case "$PACKAGE_KIND" in
            appimage) PACKAGE_TARGET=AppImageDocker ;;
            macos) PACKAGE_TARGET=MacDockerU ;;
            windows) PACKAGE_TARGET=WinDocker ;;
          esac
          CCACHE_DISABLE=1 cmake --build cmake-build-release --target "$PACKAGE_TARGET" -j 6
      - name: Normalize package filenames
        if: matrix.kind == 'build'
        env:
          PACKAGE_KIND: ${{ matrix.package }}
        run: |
          set -euo pipefail
          case "$PACKAGE_KIND" in
            appimage)
              APPIMAGE_FILE="$(find cmake-build-release/appimage-docker-out -maxdepth 1 -type f -name '*.AppImage' | sort | head -n 1)"
              if [ -z "$APPIMAGE_FILE" ]; then echo "Missing AppImage package." >&2; exit 1; fi ;;
            macos)
              mv -f cmake-build-release/mac-docker-out/QMud.app.zip "cmake-build-release/mac-docker-out/QMud-${QMUD_PACKAGE_VERSION}-macos.app.zip"
              mv -f cmake-build-release/mac-docker-out/QMud.dmg "cmake-build-release/mac-docker-out/QMud-${QMUD_PACKAGE_VERSION}-macos.dmg" ;;
            windows)
              mv -f cmake-build-release/windows-docker-out/QMud.zip "cmake-build-release/windows-docker-out/QMud-${QMUD_PACKAGE_VERSION}-windows.zip"
              mv -f cmake-build-release/windows-docker-out/QMud-setup.exe "cmake-build-release/windows-docker-out/QMud-${QMUD_PACKAGE_VERSION}-win-setup.exe" ;;
          esac
      - name: Upload AppImage artifact
        if: matrix.package == 'appimage'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qmud-appimage-${{ needs.pipeline-plan.outputs.source_sha }}
          if-no-files-found: error
          path: |
            cmake-build-release/appimage-docker-out/*.AppImage
            cmake-build-release/appimage-docker-out/*.AppImage.zsync
      - name: Upload macOS artifact
        if: matrix.package == 'macos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qmud-macos-${{ needs.pipeline-plan.outputs.source_sha }}
          if-no-files-found: error
          path: |
            cmake-build-release/mac-docker-out/QMud-*.app.zip
            cmake-build-release/mac-docker-out/QMud-*.dmg
      - name: Upload Windows artifact
        if: matrix.package == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qmud-windows-${{ needs.pipeline-plan.outputs.source_sha }}
          if-no-files-found: error
          path: |
            cmake-build-release/windows-docker-out/QMud-*.zip
            cmake-build-release/windows-docker-out/QMud-*.exe
      - name: Cleanup self-hosted workspace
        if: always() && matrix.kind == 'build'
        run: |
          if [ -n "${QMUD_CI_CONTAINER_NAME:-}" ]; then
            "$QMUD_DOCKER_EXECUTABLE" rm --force "$QMUD_CI_CONTAINER_NAME" >/dev/null 2>&1 || true
          fi
          rm -rf cmake-build-release cmake-build-coverage release-assets

  publish-release:
    name: Publish tagged-release
    needs:
      - pipeline-plan
      - pipeline
    if: >-
      always() && !cancelled() &&
      needs.pipeline-plan.result == 'success' &&
      needs.pipeline.result == 'success' &&
      needs.pipeline-plan.outputs.release_tag != '' &&
      needs.pipeline-plan.outputs.publish_tagged_release == 'true'
    runs-on: [ self-hosted, primary ]
    permissions:
      actions: read
      contents: write
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.pipeline-plan.outputs.source_sha }}

      - name: Clean publication workspace
        run: rm -rf release-assets release-notes.md ci-release-notes.md
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.pipeline-plan.outputs.artifact_run_id }}
          pattern: qmud-*-${{ needs.pipeline-plan.outputs.source_sha }}
          path: release-assets
          merge-multiple: true

      - name: Build release changelog body
        id: release_changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.pipeline-plan.outputs.release_tag }}
        run: |
          CURRENT_TAG="$RELEASE_TAG"
          PREVIOUS_TAG="$(git tag --sort=-v:refname --list 'v[0-9]*' | grep -E '^v[0-9]+(\.[0-9]+)*$' | awk -v cur="${CURRENT_TAG}" '$0 != cur {print; exit}')"
          SINCE=""
          if [ -n "${PREVIOUS_TAG}" ]; then
            SINCE="$(git for-each-ref --format='%(creatordate:iso-strict)' "refs/tags/${PREVIOUS_TAG}")"
          fi
          UNTIL="$(git for-each-ref --format='%(creatordate:iso-strict)' "refs/tags/${CURRENT_TAG}")"
          export SINCE UNTIL
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime

          repo = os.environ["GITHUB_REPOSITORY"]
          api_base = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          token = os.environ.get("GITHUB_TOKEN", "").strip()
          output_path = "release-notes.md"
          section_names = (
              "Bug Fixes",
              "Features",
              "Performance Optimizations",
              "Maintenance",
          )

          def parse_time(value: str) -> datetime:
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          def fetch_merged_pulls() -> list[dict]:
              pulls: list[dict] = []
              page = 1
              while True:
                  query = urllib.parse.urlencode({
                      "state": "closed",
                      "base": "main",
                      "per_page": 100,
                      "page": page,
                  })
                  url = f"{api_base}/repos/{repo}/pulls?{query}"
                  headers = {
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "qmud-release-notes",
                  }
                  if token:
                      headers["Authorization"] = f"Bearer {token}"
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  if not isinstance(payload, list):
                      raise RuntimeError("GitHub returned an invalid pull-request list.")
                  pulls.extend(pr for pr in payload if isinstance(pr, dict) and pr.get("merged_at"))
                  if len(payload) < 100:
                      return pulls
                  page += 1

          def parse_changelog(body: str, number: int) -> dict[str, list[str]]:
              changelog_headings = list(re.finditer(r"(?m)^##[ \t]+Changelog[ \t]*$", body))
              if len(changelog_headings) != 1:
                  raise RuntimeError(f"PR #{number} must contain exactly one '## Changelog' section.")
              start = changelog_headings[0].end()
              next_heading = re.search(r"(?m)^##[ \t]+", body[start:])
              end = start + next_heading.start() if next_heading else len(body)
              block = body[start:end]

              subsection_matches = list(re.finditer(r"(?m)^###[ \t]+(.+?)[ \t]*$", block))
              found_names = [match.group(1) for match in subsection_matches]
              if found_names != list(section_names):
                  raise RuntimeError(
                      f"PR #{number} must contain the Changelog subsections in template order: "
                      + ", ".join(section_names)
                      + "."
                  )

              parsed = {name: [] for name in section_names}
              for index, match in enumerate(subsection_matches):
                  section_end = subsection_matches[index + 1].start() if index + 1 < len(subsection_matches) else len(block)
                  section_body = block[match.end():section_end]
                  current_entry: list[str] | None = None
                  for line in section_body.splitlines():
                      bullet = re.fullmatch(r"[ \t]*[-*][ \t]+(.*)", line)
                      if bullet:
                          if current_entry is not None:
                              entry = "\n".join(current_entry).rstrip()
                              if not entry:
                                  raise RuntimeError(f"PR #{number} contains an empty Changelog bullet.")
                              parsed[match.group(1)].append(entry)
                          current_entry = [bullet.group(1)]
                      elif current_entry is not None:
                          current_entry.append(line)
                      elif line.strip():
                          raise RuntimeError(
                              f"PR #{number} contains content before the first bullet under "
                              f"'### {match.group(1)}': {line.strip()}"
                          )
                  if current_entry is not None:
                      entry = "\n".join(current_entry).rstrip()
                      if not entry:
                          raise RuntimeError(f"PR #{number} contains an empty Changelog bullet.")
                      parsed[match.group(1)].append(entry)
              if not any(parsed.values()):
                  raise RuntimeError(f"PR #{number} has no Changelog entries.")
              return parsed

          since_text = os.environ.get("SINCE", "").strip()
          since = parse_time(since_text) if since_text else None
          until = parse_time(os.environ["UNTIL"])
          pulls = []
          for pull in fetch_merged_pulls():
              merged_at = parse_time(str(pull["merged_at"]))
              if since is not None and merged_at <= since:
                  continue
              if merged_at > until:
                  continue
              pulls.append(pull)
          pulls.sort(key=lambda pull: (parse_time(str(pull["merged_at"])), int(pull["number"])))

          entries = {name: [] for name in section_names}
          for pull in pulls:
              number = int(pull["number"])
              parsed = parse_changelog(str(pull.get("body") or ""), number)
              user = pull.get("user")
              login = str(user.get("login") or "").strip() if isinstance(user, dict) else ""
              pr_link = f"[#{number}](https://github.com/Nodens-/QMud/pull/{number})"
              attribution = f" by @{login} ({pr_link})" if login else f" ({pr_link})"
              for section_name in section_names:
                  for entry in parsed[section_name]:
                      entries[section_name].append(f"* {entry}{attribution}")

          lines = ["## What's changed", ""]
          for section_name in section_names[:3]:
              lines.extend((f"### {section_name}", ""))
              lines.extend(entries[section_name])
              lines.append("")

          with open(output_path, "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines).rstrip() + "\n")
          PY
          echo "body_path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_NOTES_PATH: ${{ steps.release_changelog.outputs.body_path }}
          RELEASE_TAG: ${{ needs.pipeline-plan.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.pipeline-plan.outputs.source_sha }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const {owner, repo} = context.repo;
            const tag = process.env.RELEASE_TAG;
            const assetDirectory = "release-assets";
            const availableNames = fs.readdirSync(assetDirectory).filter((name) =>
              fs.statSync(path.join(assetDirectory, name)).isFile(),
            );
            const requiredAssets = [
              ["AppImage", (name) => name.endsWith(".AppImage"), "application/octet-stream"],
              ["AppImage zsync", (name) => name.endsWith(".AppImage.zsync"), "application/octet-stream"],
              ["macOS app zip", (name) => name.endsWith("-macos.app.zip"), "application/zip"],
              ["macOS DMG", (name) => name.endsWith("-macos.dmg"), "application/x-apple-diskimage"],
              ["Windows zip", (name) => name.endsWith("-windows.zip"), "application/zip"],
              ["Windows installer", (name) => name.endsWith("-win-setup.exe"), "application/vnd.microsoft.portable-executable"],
            ];
            const assets = requiredAssets.map(([label, matches, contentType]) => {
              const names = availableNames.filter(matches);
              if (names.length !== 1) {
                throw new Error(`Expected exactly one ${label} asset, found ${names.length}: ${names.join(", ")}`);
              }
              return {name: names[0], contentType};
            });
            const body = fs.readFileSync(process.env.RELEASE_NOTES_PATH, "utf8");

            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({owner, repo, tag});
              release = await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.data.id,
                tag_name: tag,
                name: tag,
                body,
                draft: false,
                prerelease: false,
                make_latest: "true",
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: process.env.SOURCE_SHA,
                name: tag,
                body,
                draft: false,
                prerelease: false,
                make_latest: "true",
              });
            }

            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.data.id,
              per_page: 100,
            });
            const replacementNames = new Set(assets.map((asset) => asset.name));
            for (const asset of existingAssets) {
              if (replacementNames.has(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: asset.id});
              }
            }
            for (const asset of assets) {
              const data = fs.readFileSync(path.join(assetDirectory, asset.name));
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.data.id,
                name: asset.name,
                headers: {
                  "content-type": asset.contentType,
                  "content-length": data.length,
                },
                data,
              });
            }

      - name: Announce tagged release on Discord
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          RELEASE_NOTES_PATH: ${{ steps.release_changelog.outputs.body_path }}
          RELEASE_TAG: ${{ needs.pipeline-plan.outputs.release_tag }}
        run: |
          if [ -z "${DISCORD_RELEASE_WEBHOOK_URL}" ]; then
            echo "DISCORD_RELEASE_WEBHOOK_URL is not set." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ["DISCORD_RELEASE_WEBHOOK_URL"].strip()
          notes_path = os.environ["RELEASE_NOTES_PATH"].strip()
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          release_url = f"https://github.com/{repo}/releases/tag/{tag}"

          def post_message(content: str) -> None:
              payload = json.dumps({"content": content}).encode("utf-8")
              request = urllib.request.Request(
                  webhook,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "qmud-release-discord",
                  },
              )
              with urllib.request.urlopen(request, timeout=20):
                  pass

          with open(notes_path, "r", encoding="utf-8") as fh:
              notes = fh.read()
          notes = notes.strip()
          if not notes:
              notes = "(No release notes.)"

          combined_message = f"QMud {tag} released: <{release_url}>\n\n{notes}"

          max_len = 2000
          chunks = []
          remaining = combined_message
          while remaining:
              if len(remaining) <= max_len:
                  chunks.append(remaining)
                  break
              split_index = remaining.rfind("\n", 0, max_len)
              if split_index <= 0:
                  split_index = max_len
              chunks.append(remaining[:split_index])
              remaining = remaining[split_index:]

          for chunk in chunks:
              post_message(chunk)
          PY

      - name: Cleanup workspace build directories
        if: always()
        run: |
          rm -rf cmake-build-release cmake-build-coverage release-assets release-notes.md ci-release-notes.md
