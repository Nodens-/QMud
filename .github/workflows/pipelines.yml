name: Pipelines

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      run_full_tests:
        description: "Run full test suite"
        required: false
        type: boolean
        default: false
      run_coverage:
        description: "Run coverage"
        required: false
        type: boolean
        default: false
      publish_tagged_release:
        description: "Publish tagged-release"
        required: false
        type: boolean
        default: false
      publish_ci_main:
        description: "Publish ci-main"
        required: false
        type: boolean
        default: false
      run_main_pipeline:
        description: "Run push-to-main (MutEx)"
        required: false
        type: boolean
        default: false
      run_tagged_release:
        description: "Run tagged-release (MutEx)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  pipeline-plan:
    name: Plan pipeline matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      needs_linux_image: ${{ steps.plan.outputs.needs_linux_image }}
      artifact_run_id: ${{ steps.plan.outputs.artifact_run_id }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      publish_tagged_release: ${{ steps.plan.outputs.publish_tagged_release }}
      publish_ci_release: ${{ steps.plan.outputs.publish_ci_release }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Determine tasks
        id: plan
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const entries = [];
            const hosted = "ubuntu-latest";
            const selfHosted = ["self-hosted", "primary"];
            const addValidation = (task, timeout) => entries.push({
              task, kind: "validation", runner: hosted, timeout,
            });
            const addBuilds = (buildType = "Release", taskPrefix = "build") => {
              for (const packageName of ["appimage", "macos", "windows"]) {
                entries.push({
                  task: taskPrefix + "-" + packageName,
                  kind: "build",
                  package: packageName,
                  build_type: buildType,
                  runner: selfHosted,
                  timeout: 180,
                });
              }
            };
            const resolveHeadReleaseTag = async () => {
              const response = await github.rest.repos.getContent({
                owner, repo, path: "src/Version.h", ref: context.sha,
              });
              if (Array.isArray(response.data) || response.data.type !== "file" || !response.data.content) {
                throw new Error("Could not read src/Version.h at the selected HEAD.");
              }
              const contents = Buffer.from(response.data.content, "base64").toString("utf8");
              const versionMatch = contents.match(/kVersionString\[\]\s*=\s*"([^"]+)"/);
              if (!versionMatch) {
                throw new Error("Could not resolve kVersionString from src/Version.h.");
              }

              const tagName = `v${versionMatch[1]}`;
              const tagRef = await github.rest.git.getRef({owner, repo, ref: `tags/${tagName}`});
              let target = tagRef.data.object;
              while (target.type === "tag") {
                const tag = await github.rest.git.getTag({owner, repo, tag_sha: target.sha});
                target = tag.data.object;
              }
              if (target.type !== "commit" || target.sha !== context.sha) {
                throw new Error(`${tagName} does not point to the selected HEAD ${context.sha}.`);
              }
              return tagName;
            };
            const findArtifactRun = async (publication, releaseTag = "") => {
              const ciJobs = ["build-appimage", "build-macos", "build-windows"];
              const taggedJobs = ["tagged-build-appimage", "tagged-build-macos", "tagged-build-windows"];
              const requiredArtifacts = new Set(["qmud-appimage", "qmud-macos", "qmud-windows"]);

              for (let page = 1; ; page += 1) {
                const response = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: "pipelines.yml",
                  status: "completed",
                  per_page: 100,
                  page,
                });
                const runs = Array.isArray(response.data.workflow_runs) ? response.data.workflow_runs : [];
                for (const run of runs) {
                  if (run.event === "pull_request" || run.id === context.runId || run.head_sha !== context.sha) {
                    continue;
                  }

                  const automaticTaggedRun = publication === "tagged" &&
                    run.event === "push" && run.head_branch === releaseTag;
                  const manualTaggedRun = publication === "tagged" &&
                    run.event === "workflow_dispatch" && run.head_branch === "main";
                  const ciRun = publication === "ci" && run.head_branch === "main" &&
                    (run.event === "push" || run.event === "workflow_dispatch");
                  if (!automaticTaggedRun && !manualTaggedRun && !ciRun) continue;

                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                    owner, repo, run_id: run.id, per_page: 100,
                  });
                  const successfulJobs = new Set(
                    jobs.filter((job) => job.conclusion === "success").map((job) => job.name),
                  );
                  const hasCiJobs = ciJobs.every((name) => successfulJobs.has(name));
                  const hasTaggedJobs = taggedJobs.every((name) => successfulJobs.has(name));
                  if ((ciRun && !hasCiJobs) ||
                      (manualTaggedRun && !hasTaggedJobs) ||
                      (automaticTaggedRun && !hasTaggedJobs && !hasCiJobs)) {
                    continue;
                  }

                  const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                    owner, repo, run_id: run.id, per_page: 100,
                  });
                  const availableArtifacts = new Set(
                    artifacts.filter((artifact) => !artifact.expired).map((artifact) => artifact.name),
                  );
                  if ([...requiredArtifacts].every((name) => availableArtifacts.has(name))) {
                    return String(run.id);
                  }
                }
                if (runs.length < 100) break;
              }

              throw new Error(
                `No completed ${publication} build at HEAD ${context.sha} has all successful Release package builds and artifacts.`,
              );
            };
            const coveragePath = (name) => name.startsWith("src/") || name.startsWith("tests/");
            const pipelinePath = (name) => (
              coveragePath(name) ||
              name.startsWith("resources/") ||
              name.startsWith("skeleton/") ||
              name.startsWith("tools/") ||
              name === "CMakeLists.txt" ||
              name.endsWith("/CMakeLists.txt")
            );

            let runPipeline = false;
            let runCoverage = false;
            let artifactRunId = String(context.runId);
            let releaseTag = "";
            let publishTaggedRelease = false;
            let publishCiRelease = false;
            if (context.eventName === "pull_request") {
              const pullNumber = context.payload.pull_request.number;
              for (let page = 1; ; page += 1) {
                const response = await github.rest.pulls.listFiles({
                  owner, repo, pull_number: pullNumber, per_page: 100, page,
                });
                const files = Array.isArray(response.data) ? response.data : [];
                runPipeline ||= files.some((file) => pipelinePath(file.filename || ""));
                runCoverage ||= files.some((file) => coveragePath(file.filename || ""));
                if ((runPipeline && runCoverage) || files.length < 100) break;
              }
              if (runPipeline) {
                addValidation("quick-tests", 90);
                addBuilds("Debug");
              }
            } else if (context.eventName === "push" && context.ref === "refs/heads/main") {
              const before = context.payload.before;
              const after = context.payload.after || context.sha;
              if (!before || /^0+$/.test(before)) {
                runPipeline = true;
              } else {
                const response = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: before + "..." + after,
                });
                const files = Array.isArray(response.data.files) ? response.data.files : [];
                runPipeline = files.some((file) => pipelinePath(file.filename || ""));
                runCoverage = files.some((file) => coveragePath(file.filename || ""));
              }
              if (runPipeline) {
                addValidation("quick-tests", 90);
                if (runCoverage) addValidation("coverage", 120);
                addBuilds();
                publishCiRelease = true;
              }
            } else if (context.eventName === "push" && context.ref.startsWith("refs/tags/v")) {
              addBuilds("Release", "tagged-build");
              releaseTag = context.ref.replace("refs/tags/", "");
              publishTaggedRelease = true;
            } else if (context.eventName === "schedule") {
              addValidation("full-tests", 90);
            } else if (context.eventName === "workflow_dispatch") {
              const runMainPipeline = context.payload.inputs?.run_main_pipeline === "true";
              const runTaggedRelease = context.payload.inputs?.run_tagged_release === "true";
              if (runMainPipeline && runTaggedRelease) {
                throw new Error("Select only one mutually exclusive complete pipeline.");
              }

              if (runMainPipeline) {
                if (context.ref !== "refs/heads/main") {
                  throw new Error("The complete push-to-main pipeline must be dispatched from main.");
                }
                addValidation("quick-tests", 90);
                addValidation("coverage", 120);
                addBuilds();
                publishCiRelease = true;
              } else if (runTaggedRelease) {
                if (context.ref !== "refs/heads/main") {
                  throw new Error("The complete tagged-release pipeline must be dispatched from main.");
                }
                releaseTag = await resolveHeadReleaseTag();
                addBuilds("Release", "tagged-build");
                publishTaggedRelease = true;
              } else {
                if (context.payload.inputs?.run_full_tests === "true") addValidation("full-tests", 90);
                if (context.payload.inputs?.run_coverage === "true") addValidation("coverage", 120);

                const publishTagged = context.payload.inputs?.publish_tagged_release === "true";
                const publishCi = context.payload.inputs?.publish_ci_main === "true";
                if (publishTagged && publishCi) {
                  throw new Error("Select only one publication target.");
                }
                if (publishTagged) {
                  if (context.ref !== "refs/heads/main") {
                    throw new Error("Tagged-release publication must be dispatched from main.");
                  }
                  releaseTag = await resolveHeadReleaseTag();
                  artifactRunId = await findArtifactRun("tagged", releaseTag);
                  publishTaggedRelease = true;
                } else if (publishCi) {
                  if (context.ref !== "refs/heads/main") {
                    throw new Error("ci-main publication must be dispatched from main.");
                  }
                  artifactRunId = await findArtifactRun("ci");
                  publishCiRelease = true;
                }
              }
            }

            const needsLinuxImage = entries.some((entry) => entry.kind === "validation");
            if (entries.length === 0) {
              entries.push({task: "nothing-to-run", kind: "noop", runner: hosted, timeout: 5});
            }
            core.info("Pipeline matrix: " + JSON.stringify(entries));
            core.setOutput("matrix", JSON.stringify({include: entries}));
            core.setOutput("needs_linux_image", needsLinuxImage ? "true" : "false");
            core.setOutput("artifact_run_id", artifactRunId);
            core.setOutput("release_tag", releaseTag);
            core.setOutput("publish_tagged_release", publishTaggedRelease ? "true" : "false");
            core.setOutput("publish_ci_release", publishCiRelease ? "true" : "false");

  prepare-linux-image:
    name: Prepare Linux image
    needs: pipeline-plan
    if: needs.pipeline-plan.outputs.needs_linux_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image-reference.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Resolve Linux image reference
        id: image-reference
        run: |
          set -euo pipefail
          IMAGE_SERIAL="$(tr -d '[:space:]' < tools/docker/appimage-qt611/IMAGE_REVISION)"
          if ! [[ "$IMAGE_SERIAL" =~ ^[0-9]{10}$ ]]; then
            echo "Invalid AppImage image revision: $IMAGE_SERIAL" >&2
            exit 1
          fi
          IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/$IMAGE_OWNER/qmud-appimage-builder:$IMAGE_SERIAL" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Ensure Linux image exists
        id: ensure-image
        env:
          GHCR_IMAGE: ${{ steps.image-reference.outputs.image }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$GHCR_IMAGE" >/dev/null; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "The required repository-owned Linux image is missing, and fork pull requests cannot publish it: $GHCR_IMAGE" >&2
            exit 1
          fi
          LOCAL_IMAGE="qmud-appimage-builder:${GHCR_IMAGE##*:}"
          docker build --pull --no-cache \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=${GHCR_IMAGE##*:}" \
            --file tools/docker/appimage-qt611/Dockerfile \
            --tag "$LOCAL_IMAGE" \
            tools/docker/appimage-qt611
          if docker manifest inspect "$GHCR_IMAGE" >/dev/null; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker tag "$LOCAL_IMAGE" "$GHCR_IMAGE"
          docker push "$GHCR_IMAGE"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Keep the newest two Linux images
        if: steps.ensure-image.outputs.pushed == 'true'
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: qmud-appimage-builder
          package-type: container
          min-versions-to-keep: 2
          token: ${{ github.token }}

  pipeline:
    name: ${{ matrix.task }}
    needs: [pipeline-plan, prepare-linux-image]
    if: always() && needs.pipeline-plan.result == 'success' && (needs.prepare-linux-image.result == 'success' || needs.prepare-linux-image.result == 'skipped')
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.pipeline-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      packages: read
    env:
      QT_QPA_PLATFORM: offscreen
      QMUD_LINUX_IMAGE: ${{ needs.prepare-linux-image.outputs.image }}
    steps:
      - name: Check out repository
        if: matrix.kind != 'noop'
        uses: actions/checkout@v6

      - name: Log in to GHCR
        if: matrix.kind == 'validation'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Pull Linux image
        if: matrix.kind == 'validation'
        run: docker pull "$QMUD_LINUX_IMAGE"

      - name: Run test suite
        if: matrix.task == 'quick-tests' || matrix.task == 'full-tests'
        env:
          TEST_SUITE: ${{ matrix.task }}
        run: |
          mkdir -p ci-build
          chmod 0777 ci-build
          docker run --rm --interactive --user "$(id -u):$(id -g)" \
            -e CCACHE_DISABLE=1 -e HOME=/tmp -e QT_QPA_PLATFORM=offscreen \
            -v "$GITHUB_WORKSPACE:/home/user/project:ro" \
            -v "$GITHUB_WORKSPACE/ci-build:/home/user/build:rw" \
            "$QMUD_LINUX_IMAGE" bash -s -- "$TEST_SUITE" <<'CONTAINER'
          set -euo pipefail
          TEST_SUITE=$1
          cmake -S /home/user/project -B /home/user/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH=/opt/Qt/latest/gcc_64 \
            -DQt6_DIR=/opt/Qt/latest/gcc_64/lib/cmake/Qt6 \
            -DQMUD_ENABLE_TESTING=ON -DQMUD_ENABLE_GUI_TESTS=ON \
            -DQMUD_ENABLE_APPIMAGE=OFF \
            -DQMUD_ENABLE_APPIMAGE_DOCKER=OFF \
            -DQMUD_ENABLE_MAC_DOCKER=OFF -DQMUD_ENABLE_WINDOCKER=OFF
          CCACHE_DISABLE=1 cmake --build /home/user/build --parallel
          if [ "$TEST_SUITE" = quick-tests ]; then
            ctest --test-dir /home/user/build --output-on-failure --label-exclude slow
          else
            ctest --test-dir /home/user/build --output-on-failure
          fi
          CONTAINER
      - name: Upload CTest logs
        if: always() && (matrix.task == 'quick-tests' || matrix.task == 'full-tests')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.task }}-ctest-logs
          if-no-files-found: ignore
          path: |
            ci-build/Testing/Temporary/*
            ci-build/Testing/**/*.xml
      - name: Upload failing test executables
        if: failure() && (matrix.task == 'quick-tests' || matrix.task == 'full-tests')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.task }}-qtest-binaries
          if-no-files-found: ignore
          path: ci-build/tests/tst_*

      - name: Run coverage
        if: matrix.task == 'coverage'
        run: |
          mkdir -p ci-build
          chmod 0777 ci-build
          docker run --rm --interactive --user "$(id -u):$(id -g)" \
            -e CCACHE_DISABLE=1 -e HOME=/tmp -e QT_QPA_PLATFORM=offscreen \
            -v "$GITHUB_WORKSPACE:/home/user/project:ro" \
            -v "$GITHUB_WORKSPACE/ci-build:/home/user/build:rw" \
            "$QMUD_LINUX_IMAGE" bash -s <<'CONTAINER'
          set -euo pipefail
          cmake -S /home/user/project -B /home/user/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH=/opt/Qt/latest/gcc_64 \
            -DQt6_DIR=/opt/Qt/latest/gcc_64/lib/cmake/Qt6 \
            -DQMUD_ENABLE_TESTING=ON -DQMUD_ENABLE_GUI_TESTS=ON \
            -DQMUD_ENABLE_APPIMAGE=OFF \
            -DQMUD_ENABLE_APPIMAGE_DOCKER=OFF \
            -DQMUD_ENABLE_MAC_DOCKER=OFF -DQMUD_ENABLE_WINDOCKER=OFF \
            -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage \
            -DCMAKE_EXE_LINKER_FLAGS=--coverage
          CCACHE_DISABLE=1 cmake --build /home/user/build --parallel
          ctest --test-dir /home/user/build --output-on-failure --label-exclude slow
          mkdir -p /home/user/build/coverage-html
          gcovr --root /home/user/project --object-directory /home/user/build \
            --filter /home/user/project/src/ --print-summary \
            --xml-pretty --xml /home/user/build/coverage.xml \
            --html-details /home/user/build/coverage-html/index.html
          CONTAINER
      - name: Upload coverage artifacts
        if: matrix.task == 'coverage'
        uses: actions/upload-artifact@v7
        with:
          name: qmud-coverage
          if-no-files-found: error
          path: |
            ci-build/coverage.xml
            ci-build/coverage-html/**
      - name: Upload coverage to Codecov
        if: matrix.task == 'coverage'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ci-build/coverage.xml
          fail_ci_if_error: true

      - name: Clean self-hosted workspace
        if: matrix.kind == 'build'
        run: rm -rf cmake-build-release cmake-build-coverage release-assets
      - name: Resolve package version
        if: matrix.kind == 'build'
        env:
          TAGGED_RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tagged_release }}
        run: |
          set -euo pipefail
          BASE_VERSION="$(sed -n 's/.*kVersionString\[\] = "\([^"]*\)".*/\1/p' src/Version.h | head -n 1)"
          if [ -z "$BASE_VERSION" ]; then
            echo "Failed to resolve kVersionString from src/Version.h" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* || "$TAGGED_RELEASE_BUILD" == "true" ]]; then
            PACKAGE_VERSION="$BASE_VERSION"
          else
            PACKAGE_VERSION="ci-${GITHUB_SHA::7}"
          fi
          echo "QMUD_PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
      - name: Verify self-hosted dependencies
        if: matrix.kind == 'build'
        run: |
          set -euo pipefail
          for tool in cmake ninja python3 pkg-config gcc g++ curl patchelf podman; do
            command -v "$tool" >/dev/null 2>&1 || { echo "Missing required tool: $tool" >&2; exit 1; }
          done
      - name: Resolve self-hosted Qt 6
        if: matrix.kind == 'build'
        run: |
          set -euo pipefail
          QT6_CMAKE_DIR=""
          if [ -n "${QT_ROOT:-}" ]; then
            if [ -d "$QT_ROOT/lib/cmake/Qt6" ]; then
              QT6_CMAKE_DIR="$QT_ROOT/lib/cmake/Qt6"
            elif [ -d "$QT_ROOT/lib64/cmake/Qt6" ]; then
              QT6_CMAKE_DIR="$QT_ROOT/lib64/cmake/Qt6"
            else
              echo "Qt6 CMake package not found under $QT_ROOT." >&2
              exit 1
            fi
          else
            QT6_CONFIG_FILE="$(find /opt/Qt /usr/lib64 /usr/lib -type f -path '*/cmake/Qt6/Qt6Config.cmake' 2>/dev/null | sort | head -n 1 || true)"
            if [ -z "$QT6_CONFIG_FILE" ]; then
              echo "Failed to locate Qt6Config.cmake." >&2
              exit 1
            fi
            QT6_CMAKE_DIR="$(dirname "$QT6_CONFIG_FILE")"
          fi
          QT_ROOT="$(cd "$QT6_CMAKE_DIR/../../.." && pwd)"
          echo "QT_ROOT=$QT_ROOT" >> "$GITHUB_ENV"
          echo "QT6_CMAKE_DIR=$QT6_CMAKE_DIR" >> "$GITHUB_ENV"
      - name: Resolve self-hosted container executable
        if: matrix.kind == 'build'
        run: |
          CONTAINER_BIN="$(command -v podman || true)"
          if [ -z "$CONTAINER_BIN" ]; then
            echo "podman executable not found on PATH." >&2
            exit 1
          fi
          echo "QMUD_DOCKER_EXECUTABLE=$CONTAINER_BIN" >> "$GITHUB_ENV"
      - name: Prepare package builder image
        if: matrix.kind == 'build'
        env:
          PACKAGE_KIND: ${{ matrix.package }}
        run: |
          set -euo pipefail
          case "$PACKAGE_KIND" in
            appimage)
              IMAGE=qmud-appimage-builder:qt6.11
              DOCKERFILE=tools/docker/appimage-qt611/Dockerfile
              CONTEXT=tools/docker/appimage-qt611 ;;
            macos)
              IMAGE=qmud-macos-builder:qt6.11
              DOCKERFILE=tools/docker/macos-qt611/Dockerfile
              CONTEXT=tools/docker/macos-qt611 ;;
            windows)
              IMAGE=qmud-windows-builder:qt6.11
              DOCKERFILE=tools/docker/windows-qt611/Dockerfile
              CONTEXT=tools/docker/windows-qt611 ;;
          esac
          if ! podman image exists "$IMAGE"; then
            podman build --file "$DOCKERFILE" --tag "$IMAGE" "$CONTEXT"
          fi
      - name: Configure package build
        if: matrix.kind == 'build'
        env:
          PACKAGE_KIND: ${{ matrix.package }}
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          set -euo pipefail
          APPIMAGE_DOCKER=OFF
          MAC_DOCKER=OFF
          WIN_DOCKER=OFF
          case "$PACKAGE_KIND" in
            appimage) APPIMAGE_DOCKER=ON; CONTAINER_NAME=AppImageDocker ;;
            macos) MAC_DOCKER=ON; CONTAINER_NAME=MacDockerU ;;
            windows) WIN_DOCKER=ON; CONTAINER_NAME=WinDocker ;;
          esac
          echo "QMUD_CI_CONTAINER_NAME=$CONTAINER_NAME" >> "$GITHUB_ENV"
          cmake -S . -B cmake-build-release -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT" -DQt6_DIR="$QT6_CMAKE_DIR" \
            -DQMUD_ENABLE_TESTING=OFF -DQMUD_CI_BUILD=ON \
            -DQMUD_APPIMAGE_VERSION="$QMUD_PACKAGE_VERSION" \
            -DQMUD_DOCKER_EXECUTABLE="$QMUD_DOCKER_EXECUTABLE" \
            -DQMUD_DOCKER_CONTAINER_NAME="$CONTAINER_NAME" \
            -DQMUD_APPIMAGE_DOCKER_BUILD_TYPE="$BUILD_TYPE" \
            -DQMUD_MAC_DOCKER_BUILD_TYPE="$BUILD_TYPE" \
            -DQMUD_WINDOCKER_BUILD_TYPE="$BUILD_TYPE" \
            -DQMUD_ENABLE_APPIMAGE=OFF \
            -DQMUD_ENABLE_APPIMAGE_DOCKER="$APPIMAGE_DOCKER" \
            -DQMUD_ENABLE_MAC_DOCKER="$MAC_DOCKER" \
            -DQMUD_ENABLE_WINDOCKER="$WIN_DOCKER"
      - name: Build package
        if: matrix.kind == 'build'
        env:
          PACKAGE_KIND: ${{ matrix.package }}
        run: |
          set -euo pipefail
          cleanup_package_container() {
            "$QMUD_DOCKER_EXECUTABLE" rm --force "$QMUD_CI_CONTAINER_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup_package_container EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          cleanup_package_container
          case "$PACKAGE_KIND" in
            appimage) PACKAGE_TARGET=AppImageDocker ;;
            macos) PACKAGE_TARGET=MacDockerU ;;
            windows) PACKAGE_TARGET=WinDocker ;;
          esac
          CCACHE_DISABLE=1 cmake --build cmake-build-release --target "$PACKAGE_TARGET" -j 6
      - name: Normalize package filenames
        if: matrix.kind == 'build'
        env:
          PACKAGE_KIND: ${{ matrix.package }}
        run: |
          set -euo pipefail
          case "$PACKAGE_KIND" in
            appimage)
              APPIMAGE_FILE="$(find cmake-build-release/appimage-docker-out -maxdepth 1 -type f -name '*.AppImage' | sort | head -n 1)"
              if [ -z "$APPIMAGE_FILE" ]; then echo "Missing AppImage package." >&2; exit 1; fi ;;
            macos)
              mv -f cmake-build-release/mac-docker-out/QMud.app.zip "cmake-build-release/mac-docker-out/QMud-${QMUD_PACKAGE_VERSION}-macos.app.zip"
              mv -f cmake-build-release/mac-docker-out/QMud.dmg "cmake-build-release/mac-docker-out/QMud-${QMUD_PACKAGE_VERSION}-macos.dmg" ;;
            windows)
              mv -f cmake-build-release/windows-docker-out/QMud.zip "cmake-build-release/windows-docker-out/QMud-${QMUD_PACKAGE_VERSION}-windows.zip"
              mv -f cmake-build-release/windows-docker-out/QMud-setup.exe "cmake-build-release/windows-docker-out/QMud-${QMUD_PACKAGE_VERSION}-win-setup.exe" ;;
          esac
      - name: Upload AppImage artifact
        if: matrix.package == 'appimage'
        uses: actions/upload-artifact@v7
        with:
          name: qmud-appimage
          if-no-files-found: error
          path: |
            cmake-build-release/appimage-docker-out/*.AppImage
            cmake-build-release/appimage-docker-out/*.AppImage.zsync
      - name: Upload macOS artifact
        if: matrix.package == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: qmud-macos
          if-no-files-found: error
          path: |
            cmake-build-release/mac-docker-out/QMud-*.app.zip
            cmake-build-release/mac-docker-out/QMud-*.dmg
      - name: Upload Windows artifact
        if: matrix.package == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: qmud-windows
          if-no-files-found: error
          path: |
            cmake-build-release/windows-docker-out/QMud-*.zip
            cmake-build-release/windows-docker-out/QMud-*.exe
      - name: Cleanup self-hosted workspace
        if: always() && matrix.kind == 'build'
        run: |
          if [ -n "${QMUD_CI_CONTAINER_NAME:-}" ]; then
            "$QMUD_DOCKER_EXECUTABLE" rm --force "$QMUD_CI_CONTAINER_NAME" >/dev/null 2>&1 || true
          fi
          rm -rf cmake-build-release cmake-build-coverage release-assets

  publish-release:
    name: Publish tagged-release
    needs:
      - pipeline-plan
      - pipeline
    if: >-
      always() && !cancelled() &&
      needs.pipeline-plan.result == 'success' &&
      needs.pipeline.result == 'success' &&
      needs.pipeline-plan.outputs.release_tag != '' &&
      needs.pipeline-plan.outputs.publish_tagged_release == 'true'
    runs-on: [self-hosted, primary]
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.pipeline-plan.outputs.artifact_run_id }}
          pattern: qmud-*
          path: release-assets

      - name: Build release changelog body
        id: release_changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.pipeline-plan.outputs.release_tag }}
        run: |
          CURRENT_TAG="$RELEASE_TAG"
          PREVIOUS_TAG="$(git tag --sort=-v:refname --list 'v*' | awk -v cur="${CURRENT_TAG}" '$0 != cur {print; exit}')"
          RANGE="${CURRENT_TAG}^!"
          if [ -n "${PREVIOUS_TAG}" ]; then
            RANGE="${PREVIOUS_TAG}..${CURRENT_TAG}"
          fi
          export RANGE
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.request

          range_spec = os.environ.get("RANGE", "").strip()
          repo = os.environ["GITHUB_REPOSITORY"]
          api_base = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          token = os.environ.get("GITHUB_TOKEN", "").strip()
          output_path = "release-notes.md"

          def split_sentences(text: str) -> list[str]:
              collapsed = " ".join(text.split())
              if not collapsed:
                  return []
              return [part.strip() for part in re.split(r"(?<=\.)\s+", collapsed) if part.strip()]

          commit_pr_cache: dict[str, list[dict]] = {}

          def fetch_commit_prs(sha: str) -> list[dict]:
              if sha in commit_pr_cache:
                  return commit_pr_cache[sha]
              url = f"{api_base}/repos/{repo}/commits/{sha}/pulls"
              headers = {
                  "Accept": "application/vnd.github+json, application/vnd.github.groot-preview+json",
                  "User-Agent": "qmud-release-notes",
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      payload = json.loads(resp.read().decode("utf-8"))
              except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, json.JSONDecodeError):
                  payload = []
              prs = payload if isinstance(payload, list) else []
              commit_pr_cache[sha] = prs
              return prs

          raw = subprocess.check_output(
              ["git", "rev-list", "--first-parent", "--reverse", range_spec],
              text=True,
              encoding="utf-8",
              errors="replace",
          )
          commits = [line.strip() for line in raw.splitlines() if line.strip()]

          lines = ["## What's changed", ""]
          seen_prs: set[str] = set()
          if commits:
              for sha in commits:
                  prs = fetch_commit_prs(sha)
                  if not prs:
                      continue
                  for pr_payload in prs:
                      if not isinstance(pr_payload, dict):
                          continue
                      number = pr_payload.get("number")
                      if number is None:
                          continue
                      pr_number = str(number).strip()
                      if not pr_number or pr_number in seen_prs:
                          continue
                      seen_prs.add(pr_number)

                      source_text = str(pr_payload.get("title", "")).strip()
                      if not source_text:
                          source_text = "Untitled PR."
                      sentences = split_sentences(source_text)
                      if not sentences:
                          sentences = [source_text]

                      login = ""
                      user = pr_payload.get("user")
                      if isinstance(user, dict):
                          login = str(user.get("login", "")).strip()

                      for sentence in sentences:
                          if login:
                              lines.append(f"* {sentence} by @{login} (#{pr_number})")
                          else:
                              lines.append(f"* {sentence} (#{pr_number})")

          if len(lines) == 2:
              lines.append("* No merged pull requests found in selected range.")

          with open(output_path, "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines).rstrip() + "\n")
          PY
          echo "body_path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.pipeline-plan.outputs.release_tag }}
          generate_release_notes: false
          body_path: ${{ steps.release_changelog.outputs.body_path }}
          files: |
            release-assets/qmud-appimage/*.AppImage
            release-assets/qmud-appimage/*.AppImage.zsync
            release-assets/qmud-macos/*.app.zip
            release-assets/qmud-macos/*.dmg
            release-assets/qmud-windows/*.zip
            release-assets/qmud-windows/*.exe

      - name: Announce tagged release on Discord
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          RELEASE_NOTES_PATH: ${{ steps.release_changelog.outputs.body_path }}
          RELEASE_TAG: ${{ needs.pipeline-plan.outputs.release_tag }}
        run: |
          if [ -z "${DISCORD_RELEASE_WEBHOOK_URL}" ]; then
            echo "DISCORD_RELEASE_WEBHOOK_URL is not set." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ["DISCORD_RELEASE_WEBHOOK_URL"].strip()
          notes_path = os.environ["RELEASE_NOTES_PATH"].strip()
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          release_url = f"https://github.com/{repo}/releases/tag/{tag}"

          def post_message(content: str) -> None:
              payload = json.dumps({"content": content}).encode("utf-8")
              request = urllib.request.Request(
                  webhook,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "qmud-release-discord",
                  },
              )
              with urllib.request.urlopen(request, timeout=20):
                  pass

          with open(notes_path, "r", encoding="utf-8") as fh:
              notes = fh.read()
          notes = notes.strip()
          if not notes:
              notes = "(No release notes.)"

          combined_message = f"QMud {tag} released: <{release_url}>\n\n{notes}"

          max_len = 2000
          chunks = []
          remaining = combined_message
          while remaining:
              if len(remaining) <= max_len:
                  chunks.append(remaining)
                  break
              split_index = remaining.rfind("\n", 0, max_len)
              if split_index <= 0:
                  split_index = max_len
              chunks.append(remaining[:split_index])
              remaining = remaining[split_index:]

          for chunk in chunks:
              post_message(chunk)
          PY

      - name: Cleanup workspace build directories
        if: always()
        run: |
          rm -rf cmake-build-release cmake-build-coverage release-assets release-notes.md ci-release-notes.md
  publish-ci-release:
    name: Publish rolling ci-main
    needs:
      - pipeline-plan
      - pipeline
    if: >-
      always() && !cancelled() &&
      needs.pipeline-plan.result == 'success' &&
      needs.pipeline.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      needs.pipeline-plan.outputs.publish_ci_release == 'true'
    runs-on: [self-hosted, primary]
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve base version from Version.h
        id: version
        run: |
          VERSION_LINE="$(grep -F -m1 'kVersionString[]' src/Version.h || true)"
          BASE_VERSION="${VERSION_LINE#*\"}"
          BASE_VERSION="${BASE_VERSION%%\"*}"
          if [ -z "$BASE_VERSION" ]; then
            echo "Failed to resolve kVersionString from src/Version.h" >&2
            exit 1
          fi
          echo "base=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.pipeline-plan.outputs.artifact_run_id }}
          pattern: qmud-*
          path: release-assets

      - name: Move rolling CI tag to current commit
        run: |
          CI_TAG="ci-${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${CI_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${CI_TAG}" --force

      - name: Build CI changelog body
        id: changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_TAG="$(git tag --sort=-v:refname --list 'v*' | head -n 1)"
          RANGE="${GITHUB_SHA}^!"
          if [ -n "${PREVIOUS_TAG}" ]; then
            RANGE="${PREVIOUS_TAG}..${GITHUB_SHA}"
          fi
          export RANGE
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.request

          range_spec = os.environ.get("RANGE", "").strip()
          repo = os.environ["GITHUB_REPOSITORY"]
          api_base = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          token = os.environ.get("GITHUB_TOKEN", "").strip()
          output_path = "ci-release-notes.md"

          def split_sentences(text: str) -> list[str]:
              collapsed = " ".join(text.split())
              if not collapsed:
                  return []
              return [part.strip() for part in re.split(r"(?<=\.)\s+", collapsed) if part.strip()]

          commit_pr_cache: dict[str, list[dict]] = {}

          def fetch_commit_prs(sha: str) -> list[dict]:
              if sha in commit_pr_cache:
                  return commit_pr_cache[sha]
              url = f"{api_base}/repos/{repo}/commits/{sha}/pulls"
              headers = {
                  "Accept": "application/vnd.github+json, application/vnd.github.groot-preview+json",
                  "User-Agent": "qmud-release-notes",
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      payload = json.loads(resp.read().decode("utf-8"))
              except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, json.JSONDecodeError):
                  payload = []
              prs = payload if isinstance(payload, list) else []
              commit_pr_cache[sha] = prs
              return prs

          raw = subprocess.check_output(
              ["git", "rev-list", "--first-parent", "--reverse", range_spec],
              text=True,
              encoding="utf-8",
              errors="replace",
          )
          commits = [line.strip() for line in raw.splitlines() if line.strip()]

          lines = ["## What's changed", ""]
          seen_prs: set[str] = set()
          if commits:
              for sha in commits:
                  prs = fetch_commit_prs(sha)
                  if not prs:
                      continue
                  for pr_payload in prs:
                      if not isinstance(pr_payload, dict):
                          continue
                      number = pr_payload.get("number")
                      if number is None:
                          continue
                      pr_number = str(number).strip()
                      if not pr_number or pr_number in seen_prs:
                          continue
                      seen_prs.add(pr_number)

                      source_text = str(pr_payload.get("title", "")).strip()
                      if not source_text:
                          source_text = "Untitled PR."
                      sentences = split_sentences(source_text)
                      if not sentences:
                          sentences = [source_text]

                      login = ""
                      user = pr_payload.get("user")
                      if isinstance(user, dict):
                          login = str(user.get("login", "")).strip()

                      for sentence in sentences:
                          if login:
                              lines.append(f"* {sentence} by @{login} (#{pr_number})")
                          else:
                              lines.append(f"* {sentence} (#{pr_number})")

          if len(lines) == 2:
              lines.append("* No merged pull requests found in selected range.")

          with open(output_path, "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines).rstrip() + "\n")
          PY
          echo "body_path=ci-release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Delete old CI release
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = `ci-${context.ref.replace('refs/heads/', '')}`;
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status === 404) {
                core.info(`No existing release for tag ${tag}; skipping cleanup.`);
                return;
              }
              throw error;
            }

            core.info(`Deleting old CI release for tag ${tag}.`);
            await github.rest.repos.deleteRelease({
              owner,
              repo,
              release_id: release.data.id,
            });

      - name: Publish CI prerelease assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ci-${{ github.ref_name }}
          name: QMud v${{ steps.version.outputs.base }}-ci
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body_path: ${{ steps.changelog.outputs.body_path }}
          overwrite_files: true
          files: |
            release-assets/qmud-appimage/*.AppImage
            release-assets/qmud-appimage/*.AppImage.zsync
            release-assets/qmud-macos/*.app.zip
            release-assets/qmud-macos/*.dmg
            release-assets/qmud-windows/*.zip
            release-assets/qmud-windows/*.exe

      - name: Cleanup workspace build directories
        if: always()
        run: |
          rm -rf cmake-build-release cmake-build-coverage release-assets release-notes.md ci-release-notes.md
