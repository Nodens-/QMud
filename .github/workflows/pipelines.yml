                  current_entry: list[str] | None = None
                  for line in section_body.splitlines():
                      bullet = re.fullmatch(r"[ \t]*[-*][ \t]+(.*)", line)
                      if bullet:
                          if current_entry is not None:
                              entry = "\n".join(current_entry).rstrip()
                              if not entry:
                                  raise RuntimeError(f"PR #{number} contains an empty Changelog bullet.")
                              parsed[match.group(1)].append(entry)
                          current_entry = [bullet.group(1)]
                      elif current_entry is not None:
                          current_entry.append(line)
                      elif line.strip():
                          raise RuntimeError(
                              f"PR #{number} contains content before the first bullet under "
                              f"'### {match.group(1)}': {line.strip()}"
                          )
                  if current_entry is not None:
                      entry = "\n".join(current_entry).rstrip()
                      if not entry:
                          raise RuntimeError(f"PR #{number} contains an empty Changelog bullet.")
                      parsed[match.group(1)].append(entry)
              if not any(parsed.values()):
                  raise RuntimeError(f"PR #{number} has no Changelog entries.")
              return parsed

          since_text = os.environ.get("SINCE", "").strip()
          since = parse_time(since_text) if since_text else None
          until = parse_time(os.environ["UNTIL"])
          merged_pulls = fetch_merged_pulls()
          source_merge_times = [
              parse_time(str(pull["merged_at"]))
              for pull in merged_pulls
              if str(pull.get("merge_commit_sha") or "") == os.environ["SOURCE_SHA"]
          ]
          if source_merge_times:
              until = max(until, *source_merge_times)
          pulls = []
          for pull in merged_pulls:
              merged_at = parse_time(str(pull["merged_at"]))
              if since is not None and merged_at <= since:
                  continue
              if merged_at > until:
                  continue
              pulls.append(pull)
          pulls.sort(key=lambda pull: (parse_time(str(pull["merged_at"])), int(pull["number"])))

          entries = {name: [] for name in section_names}
          for pull in pulls:
              number = int(pull["number"])
              parsed = parse_changelog(str(pull.get("body") or ""), number)
              user = pull.get("user")
              login = str(user.get("login") or "").strip() if isinstance(user, dict) else ""
              pr_link = f"[#{number}](https://github.com/Nodens-/QMud/pull/{number})"
              attribution = f" by @{login} ({pr_link})" if login else f" ({pr_link})"
              for section_name in section_names:
                  for entry in parsed[section_name]:
                      entries[section_name].append(f"* {entry}{attribution}")

          lines = ["## What's changed", ""]
          for section_name in section_names:
              lines.extend((f"### {section_name}", ""))
              lines.extend(entries[section_name])
              lines.append("")

          with open(output_path, "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines).rstrip() + "\n")
          PY
          echo "body_path=ci-release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Delete old CI release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = "ci-main";
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status === 404) {
                core.info(`No existing release for tag ${tag}; skipping cleanup.`);
                return;
              }
              throw error;
            }

            core.info(`Deleting old CI release for tag ${tag}.`);
            await github.rest.repos.deleteRelease({
              owner,
              repo,
              release_id: release.data.id,
            });

      - name: Move rolling CI tag to current commit
        env:
          SOURCE_SHA: ${{ needs.pipeline-plan.outputs.source_sha }}
        run: |
          CI_TAG="ci-main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${CI_TAG}" "${SOURCE_SHA}"
          git push origin "refs/tags/${CI_TAG}" --force

      - name: Publish CI prerelease assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_NAME: QMud v${{ steps.version.outputs.base }}-ci
          RELEASE_NOTES_PATH: ${{ steps.changelog.outputs.body_path }}
          SOURCE_SHA: ${{ needs.pipeline-plan.outputs.source_sha }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const {owner, repo} = context.repo;
            const tag = "ci-main";
            const assetDirectory = "release-assets";
            const availableNames = fs.readdirSync(assetDirectory).filter((name) =>
              fs.statSync(path.join(assetDirectory, name)).isFile(),
            );
            const requiredAssets = [
              ["AppImage", (name) => name.endsWith(".AppImage"), "application/octet-stream"],
              ["AppImage zsync", (name) => name.endsWith(".AppImage.zsync"), "application/octet-stream"],
              ["macOS app zip", (name) => name.endsWith("-macos.app.zip"), "application/zip"],
              ["macOS DMG", (name) => name.endsWith("-macos.dmg"), "application/x-apple-diskimage"],
              ["Windows zip", (name) => name.endsWith("-windows.zip"), "application/zip"],
              ["Windows installer", (name) => name.endsWith("-win-setup.exe"), "application/vnd.microsoft.portable-executable"],
            ];
            const assets = requiredAssets.map(([label, matches, contentType]) => {
              const names = availableNames.filter(matches);
              if (names.length !== 1) {
                throw new Error(`Expected exactly one ${label} asset, found ${names.length}: ${names.join(", ")}`);
              }
              return {name: names[0], contentType};
            });
            const body = fs.readFileSync(process.env.RELEASE_NOTES_PATH, "utf8");

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: process.env.SOURCE_SHA,
              name: process.env.RELEASE_NAME,
              body,
              draft: false,
              prerelease: true,
              make_latest: "false",
            });
            for (const asset of assets) {
              const data = fs.readFileSync(path.join(assetDirectory, asset.name));
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.data.id,
                name: asset.name,
                headers: {
                  "content-type": asset.contentType,
                  "content-length": data.length,
                },
                data,
              });
            }

      - name: Cleanup workspace build directories
        if: always()
        run: |
          rm -rf cmake-build-release cmake-build-coverage release-assets release-notes.md ci-release-notes.md
